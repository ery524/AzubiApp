<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azubi Aufgaben App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>Azubi Aufgaben</h1>
            <div id="status-indicator"></div>
        </div>
        
        <div class="task-viewer">
            <iframe id="task-frame" src="about:blank"></iframe>
        </div>
        
        <div class="navigation">
            <div class="progress-info">
                <span id="current-task">0</span> / <span id="total-tasks">0</span>
            </div>
            <div class="nav-buttons">
                <button id="prev-btn" class="nav-btn" disabled>← Zurück</button>
                <button id="next-btn" class="nav-btn" disabled>Weiter →</button>
                <button id="complete-btn" class="complete-btn">✓ Erledigt</button>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
