<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2c3e50">
    <title>Azubi Aufgaben App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <h2>Willkommen</h2>
            <p>Bitte gib dein Kürzel ein:</p>
            <input type="text" id="user-abbreviation" placeholder="z.B. AB" maxlength="10" autocomplete="off">
            <button id="login-btn" class="primary-btn">Bestätigen</button>
        </div>
    </div>

    <div class="app-container">
        <div class="header">
            <h1>Azubi Aufgaben</h1>
            <div id="user-info"></div>
            <div id="status-indicator"></div>
        </div>
        
        <div class="task-viewer">
            <iframe id="task-frame" src="about:blank"></iframe>
        </div>
        
        <div class="navigation">
            <div class="progress-info">
                Aufgabe <span id="current-task">0</span> / <span id="total-tasks">0</span>
            </div>
            <div class="nav-buttons">
                <button id="prev-btn" class="nav-btn" disabled>← Zurück</button>
                <button id="next-btn" class="nav-btn" disabled>Weiter →</button>
                <button id="complete-btn" class="complete-btn">✓</button>
            </div>
            <div class="ery-logo">ERY</div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
