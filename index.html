<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2c3e50">
    <title>Azubi Aufgaben App - Kaffee & Post</title>
    
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <h2>Willkommen</h2>
            <p>Bitte gib dein Kürzel ein:</p>
            <input type="text" id="user-abbreviation" placeholder="z.B. AB" maxlength="10" autocomplete="off">
            <button id="login-btn" class="primary-btn">Bestätigen</button>
        </div>
    </div>

    <!-- Sidebar Navigation -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>Navigation</h2>
            <button id="close-sidebar" class="close-btn">&times;</button>
        </div>
        <nav class="sidebar-nav">
            <button id="nav-tasks" class="sidebar-nav-btn active">
                <span class="nav-icon">📋</span>
                <span>Aufgabenliste</span>
            </button>
            <button id="nav-table" class="sidebar-nav-btn">
                <span class="nav-icon">📊</span>
                <span>Aufgaben-Tabelle</span>
            </button>
        </nav>
    </div>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div class="app-container">
        <div class="header">
            <button id="menu-btn" class="menu-btn" aria-label="Menü öffnen">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <h1>Azubi Aufgaben</h1>
            <div id="user-info"></div>
            <div id="status-indicator"></div>
        </div>
        
        <div id="task-view" class="task-viewer">
            <iframe id="task-frame" src="about:blank"></iframe>
        </div>

        <div id="table-view" class="table-viewer" style="display: none;">
            <div class="table-header">
                <h2>Aufgaben-Tabelle</h2>
                <button id="refresh-table" class="refresh-btn">🔄 Aktualisieren</button>
            </div>
            <div id="table-container" class="table-container">
                <p class="loading">Lade Tabellendaten...</p>
            </div>
        </div>
        
        <div class="navigation">
            <div class="progress-info">
                Aufgabe <span id="current-task">0</span> / <span id="total-tasks">0</span>
            </div>
            <div class="nav-buttons">
                <button id="prev-btn" class="nav-btn" disabled>← Zurück</button>
                <button id="next-btn" class="nav-btn" disabled>Weiter →</button>
                <button id="complete-btn" class="complete-btn">✓</button>
            </div>
            <div class="ery-logo">ERY</div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
