<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azubi Aufgaben App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <h2>Willkommen</h2>
            <p>Bitte gib dein Kürzel ein:</p>
            <input type="text" id="user-abbreviation" placeholder="z.B. AB" maxlength="10" autocomplete="off">
            <button id="login-btn" class="primary-btn">Bestätigen</button>
        </div>
    </div>

    <div class="app-container">
        <div class="header">
            <h1>Azubi Aufgaben</h1>
            <div id="user-info"></div>
            <div id="status-indicator"></div>
            <button id="show-table-btn" class="table-btn">📊 Tabelle</button>
        </div>
        
        <div class="task-viewer">
            <iframe id="task-frame" src="about:blank"></iframe>
        </div>
        
        <div class="navigation">
            <div class="progress-info">
                <span id="current-task">0</span> / <span id="total-tasks">0</span>
            </div>
            <div class="nav-buttons">
                <button id="prev-btn" class="nav-btn" disabled>← Zurück</button>
                <button id="next-btn" class="nav-btn" disabled>Weiter →</button>
                <button id="complete-btn" class="complete-btn">✓</button>
            </div>
        </div>
    </div>
    
    <!-- Table Modal -->
    <div id="table-modal" class="modal">
        <div class="modal-content table-modal-content">
            <div class="modal-header">
                <h2>Aufgaben-Tabelle</h2>
                <button id="close-table-btn" class="close-btn">✕</button>
            </div>
            <div class="modal-actions">
                <button id="export-excel-btn" class="export-btn">📥 Als Excel/CSV exportieren</button>
            </div>
            <div class="table-container">
                <table id="tracking-table">
                    <thead>
                        <tr>
                            <th>Kürzel</th>
                            <th>Aufgabe</th>
                            <th>Erledigt</th>
                            <th>Datum</th>
                            <th>Uhrzeit</th>
                        </tr>
                    </thead>
                    <tbody id="tracking-table-body">
                        <!-- Table rows will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
